services:
  shieldpay:
    build: .
    ports:
      - "8788:8788"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8788"
      LISTEN_HOST: "0.0.0.0"
    volumes:
      - shieldpay-sqlite:/app/backend/data
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  shieldpay-sqlite: {}
