name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Unit & API gate tests (Vitest)
        run: npm test

      - name: Coverage gate (auth / admin / requireAuth)
        run: npm run test:coverage

      - name: Smoke test (production /api/health)
        run: npm run smoke

      - name: npm audit (critical only)
        run: npm audit --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: SBOM (Trivy fs → CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          list-all-pkgs: "true"
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        run: docker build -t shieldpay:ci .

      - name: Runtime smoke test (hardened flags, matches docker-compose.yml)
        run: |
          docker run -d --name shieldpay-smoke \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp \
            -v shieldpay-smoke-data:/app/backend/data \
            -p 8788:8788 \
            -e NODE_ENV=production -e LISTEN_HOST=0.0.0.0 -e PORT=8788 \
            -e JWT_SECRET=ci-smoke-test-secret-not-for-real-use \
            -e SESSION_SECRET=ci-smoke-test-secret-not-for-real-use \
            shieldpay:ci

          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8788/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done

          docker logs shieldpay-smoke || true
          docker rm -f shieldpay-smoke >/dev/null 2>&1 || true
          docker volume rm shieldpay-smoke-data >/dev/null 2>&1 || true

          if [ -z "$ok" ]; then
            echo "::error::container never became healthy under hardened runtime flags (cap-drop ALL, read-only, no-new-privileges)"
            exit 1
          fi

      - name: AppArmor — load and enforce custom profile
        run: |
          sudo apparmor_parser -r -W policy/apparmor/shieldpay-hardened
          sudo aa-status | grep -q shieldpay-hardened

          docker run -d --name shieldpay-apparmor \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt apparmor=shieldpay-hardened \
            --read-only \
            --tmpfs /tmp \
            -v shieldpay-apparmor-data:/app/backend/data \
            -p 8789:8788 \
            -e NODE_ENV=production -e LISTEN_HOST=0.0.0.0 -e PORT=8788 \
            -e JWT_SECRET=ci-apparmor-test-secret-not-for-real-use \
            -e SESSION_SECRET=ci-apparmor-test-secret-not-for-real-use \
            shieldpay:ci

          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8789/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::app failed to serve traffic under the AppArmor profile"
            docker logs shieldpay-apparmor || true
            docker rm -f shieldpay-apparmor >/dev/null 2>&1 || true
            exit 1
          fi
          echo "app serves traffic normally under the custom AppArmor profile."

          # Negative control: prove the profile is actually confining the
          # process, not just present. /etc/shadow isn't in its read allow-list,
          # so this must be denied — if it isn't, the profile is a no-op.
          if docker exec shieldpay-apparmor cat /etc/shadow >/tmp/leak 2>/tmp/leak.err; then
            echo "::error::AppArmor profile did not block an out-of-scope file read — profile is not enforcing"
            cat /tmp/leak.err
            docker rm -f shieldpay-apparmor >/dev/null 2>&1 || true
            exit 1
          fi
          echo "confirmed: out-of-scope file read was denied ($(cat /tmp/leak.err))"

          docker rm -f shieldpay-apparmor >/dev/null 2>&1 || true
          docker volume rm shieldpay-apparmor-data >/dev/null 2>&1 || true

      - name: Trivy — built image (vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shieldpay:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Conftest (docker-compose policy)
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" -w /project \
            openpolicyagent/conftest:v0.55.0 test docker-compose.yml -p policy/

      - name: Trivy — Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
