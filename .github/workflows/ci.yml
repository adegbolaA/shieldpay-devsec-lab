name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Harden-Runner
        uses: step-security/harden-runner@v2.19.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Unit & API gate tests (Vitest)
        run: npm test

      - name: Coverage gate (auth / admin / requireAuth)
        run: npm run test:coverage

      - name: Smoke test (production /api/health)
        run: npm run smoke

      - name: npm audit (critical only)
        run: npm audit --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Harden-Runner
        uses: step-security/harden-runner@v2.19.1

      - name: SBOM (Trivy fs → CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          list-all-pkgs: "true"
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        run: docker build -t shieldpay:ci .

      - name: Trivy — built image (vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shieldpay:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Conftest (docker-compose policy)
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" -w /project \
            openpolicyagent/conftest:v0.55.0 test docker-compose.yml -p policy/

      - name: Trivy — Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
